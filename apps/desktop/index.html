<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + Vue + Typescript App</title>
  </head>

  <body>
    <script>
      window.addEventListener("error", function(e) {
        var box = document.getElementById("debug-err-box");
        if (!box) {
          box = document.createElement("div");
          box.id = "debug-err-box";
          box.style.cssText = "position:fixed;top:0;left:0;right:0;background:#dc2626;color:#ffffff;padding:12px;z-index:999999;font-family:monospace;font-size:13px;white-space:pre-wrap;border-bottom:2px solid #fff;";
          document.body.prepend(box);
        }
        box.textContent = "🚨 [JavaScript Error]: " + (e.message || e) + " at " + (e.filename || "") + ":" + (e.lineno || "");
      });
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
