[project]
name = "karaoke-analyzer"
version = "0.1.0"
description = "Karaoke System Offline Vocal Separation & Pitch Analysis Service"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "onnxruntime>=1.22.1,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
