[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/timeline",
    "crates/song-format",
    "crates/scoring",
    "crates/pitch",
    "crates/media",
    "crates/audio-win",
    "crates/audio-engine",
    "crates/recording",
    "apps/desktop/src-tauri",
    "tools/headless",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Karaoke System Team"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
rubato = "0.16"
rtrb = "0.3"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
sha2 = "0.10"
rustfft = "6.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3.17"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Media_KernelStreaming",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
