name: Release Windows portable ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Select stable Rust
        run: rustup default stable

      - name: Build portable package
        shell: powershell
        run: .\build_portable.ps1 -Version $env:RELEASE_TAG

      - name: Create or update GitHub Release
        shell: powershell
        run: |
          $zip = Get-ChildItem .\release\KARAOKE-GB-*-windows-x64-portable.zip | Select-Object -First 1
          $sha = Get-Item "$($zip.FullName).sha256.txt"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "KARAOKE-GB $env:RELEASE_TAG" --generate-notes
          }
          gh release upload $env:RELEASE_TAG $zip.FullName $sha.FullName --clobber
